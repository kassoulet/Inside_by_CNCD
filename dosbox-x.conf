# Inside by CNCD on DOSBox-X with a fixed, fast Pentium (about a Pentium 166-200).
# Run from this directory:  dosbox-x -conf dosbox-x.conf
# Fixed cycles make the demo's speed repeatable: the in-scene animation speed depends on how much work the CPU does per tick (see WRITEUP-asm.md).
# First run SETUP.EXE and pick the Gravis Ultrasound (gus=true below), or the Sound Blaster 16.
[sdl]
fullscreen=false
[dosbox]
machine=svga_s3
memsize=16
quit warning=false
[cpu]
cputype=pentium
core=normal
cycles=fixed 90000
[sblaster]
sbtype=sb16
[gus]
gus=true
[autoexec]
mount c .
c:
inside.exe
exit
